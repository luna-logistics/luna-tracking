# Cloudflare Workers static-assets deploy config.
#
# Luna is deployed as a Worker with the Static Assets binding — the modern
# Cloudflare model that replaces classic Pages projects. It behaves like Pages
# from the user's side (edge CDN, SPA fallback, _headers / _redirects support)
# but wrangler treats it as a Worker: `wrangler deploy`, not
# `wrangler pages deploy`.
#
# The presence of `pages_build_output_dir` here (removed) previously made
# wrangler misclassify this as a Pages project. The [assets] block below is
# what identifies it as a Workers-with-assets deployment.
#
# Deploy from this machine:
#   cd app/frontend
#   pnpm build
#   npx wrangler deploy
#
# The Worker's name in the dashboard is `luna-tracking` (matches `name` below).
# not_found_handling = "single-page-application" makes any unmatched path serve
# /index.html — the SPA fallback the React router needs to take over. This
# supersedes the `/* /index.html 200` rule in public/_redirects (still kept
# there as documentation + fallback if we ever migrate back to Pages).

name = "luna-tracking"
compatibility_date = "2026-01-01"

[assets]
directory = "./dist"
# SPA fallback: a request for /suivi (no file on disk) serves dist/index.html
# so React Router can take over.
not_found_handling = "single-page-application"
# Canonicalize URLs by dropping the trailing slash: `/en/shop-and-ship/`
# 307-redirects to `/en/shop-and-ship`, then the assets binding serves
# `en/shop-and-ship/index.html` from the prerender.
html_handling = "drop-trailing-slash"

# NOTE ─── canonical leak deferred, not forgotten
# The FR homepage prerender in dist/index.html carries canonical=/,
# description and og:* — served as the SPA fallback, these leak the
# homepage's SEO onto every unmatched URL. A previous attempt to fix
# this with a Worker script (worker.js + main = "worker.js" +
# not_found_handling = "none") tripped Cloudflare Error 1101 in prod,
# so we rolled back. Follow-up: iterate on worker.js locally with
# `wrangler dev` before re-enabling. Until then, the pre-worker
# behaviour holds.
