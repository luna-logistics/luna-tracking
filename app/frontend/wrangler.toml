# Cloudflare Workers static-assets deploy config.
#
# Luna is deployed as a Worker with the Static Assets binding — the modern
# Cloudflare model that replaces classic Pages projects. It behaves like Pages
# from the user's side (edge CDN, SPA fallback, _headers / _redirects support)
# but wrangler treats it as a Worker: `wrangler deploy`, not
# `wrangler pages deploy`.
#
# The presence of `pages_build_output_dir` here (removed) previously made
# wrangler misclassify this as a Pages project. The [assets] block below is
# what identifies it as a Workers-with-assets deployment.
#
# Deploys run from Cloudflare Workers Builds (Git integration). Settings →
# Build → Build configuration must be:
#   Root directory   app/frontend   (package.json lives here, not at repo root)
#   Build command    pnpm install --frozen-lockfile && pnpm build
#   Deploy command   npx wrangler deploy            (production branch: main)
#   Version command  npx wrangler versions upload   (other branches / PRs —
#                    uploads a version without replacing production)
# plus VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY as build variables.
#
# Manual deploy from a machine still works:
#   cd app/frontend
#   pnpm build
#   npx wrangler deploy
#
# The Worker's name in the dashboard is `luna-tracking` (matches `name` below).
# not_found_handling = "single-page-application" makes any unmatched path serve
# /index.html — the SPA fallback the React router needs to take over. This
# supersedes the `/* /index.html 200` rule in public/_redirects (still kept
# there as documentation + fallback if we ever migrate back to Pages).

name = "luna-tracking"
compatibility_date = "2026-01-01"
# nodejs_compat: @cloudflare/puppeteer (Browser Rendering, og:image regeneration).
compatibility_flags = ["nodejs_compat"]
main = "worker.js"

[assets]
directory = "./dist"
binding = "ASSETS"
# Worker owns the SPA fallback (via env.ASSETS.fetch). ASSETS returns a
# real 404 for missing paths; worker.js catches that and serves the
# shell with FR-homepage SEO tags stripped.
not_found_handling = "none"
# Canonicalize URLs by dropping the trailing slash: `/en/shop-and-ship/`
# 307-redirects to `/en/shop-and-ship`, then the assets binding serves
# `en/shop-and-ship/index.html` from the prerender.
html_handling = "drop-trailing-slash"

# worker.js also reads SUPABASE_URL + SUPABASE_ANON_KEY (to confirm a shared
# tracking link's token is live before serving its preview tags). They are
# Worker SECRETS (`wrangler secret put`), set once in Cloudflare: secrets
# survive every deploy, CI or a manual `wrangler deploy`. Don't also declare
# them in [vars] or pass --var (same name as a secret = deploy error).
# Without them the worker still works: share links get /suivi's own tags.

# Cloudflare Browser Rendering (headless Chrome) — used only by
# POST /api/og/suivi/regenerate in worker.js (the admin's "Régénérer l'image
# de preview"). @cloudflare/puppeteer needs nodejs_compat (set at the top).
[browser]
binding = "BROWSER"
