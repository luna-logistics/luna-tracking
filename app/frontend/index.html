<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />

  <!-- Favicons — generated from public/brand/logo-luna-250.png by
       scripts/generate-favicons.py. Every referenced file is committed
       under public/, so this list stays in lockstep with what's served. -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <meta name="theme-color" content="#002F67" />
  <meta name="msapplication-TileColor" content="#002F67" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO tags (title, description, canonical, hreflang, og:*) are baked into
       each prerendered index.html by src/prerender.tsx and swapped at runtime
       by react-helmet-async on SPA navigation — no defaults belong here. -->
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
