<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />

  <!-- Favicons — generated from public/brand/logo-luna-250.png by
       scripts/generate-favicons.py. Two colour variants: the blue phoenix
       on transparent bg for light tab bars, a near-white recolour for
       dark. `media="(prefers-color-scheme: ...)"` lets the browser pick
       the one visible on the user's tab strip. The .ico fallback stays
       the light variant so legacy tools that ignore `media` still show
       something legible. -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"      media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png"      media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32-dark.png" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16-dark.png" media="(prefers-color-scheme: dark)" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <meta name="theme-color" content="#002F67" />
  <meta name="msapplication-TileColor" content="#002F67" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Trustpilot domain ownership verification. Ships on every page but
       Trustpilot only reads it from the homepage. Safe to leave in place
       after the check clears — it's inert everywhere else. -->
  <meta name="trustpilot-one-time-domain-verification-id" content="639742b0-52f4-448f-b67e-e9645894f0a9" />

  <!-- SEO tags (title, description, canonical, hreflang, og:*) are baked into
       each prerendered index.html by src/prerender.tsx and swapped at runtime
       by react-helmet-async on SPA navigation — no defaults belong here. -->
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
