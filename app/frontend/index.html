<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />

  <!-- Favicons — generated from public/brand/logo-luna-250.png by
       scripts/generate-favicons.py. Two independent declaration groups:
       (1) Google/Bing crawlers want an unconditional, large (≥48px)
       square icon at a stable URL — they IGNORE (or misread) any <link>
       carrying a `media` attribute, so the 192x192 line and .ico stay
       naked. (2) Browsers get the dark-mode-aware 16/32 variants for
       the tab strip via `prefers-color-scheme`. Order matters: put the
       unconditional Google-friendly declarations first, so if a parser
       stops early it still picks a compliant icon. -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"      media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png"      media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32-dark.png" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16-dark.png" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Warm the TLS + DNS handshake to Supabase before any JS runs.
       Both Auth (getSession on mount) and SiteContentContext fire
       queries against this origin in the first-paint window; without
       this hint the browser only opens the connection after the JS
       parser hits the fetch call, costing ~1 RTT (~150 ms on 4G,
       ~300 ms on 3G). The URL is hard-coded — same project we already
       reference from src/lib/supabase.ts at runtime — because Vite
       can't template index.html. dns-prefetch stays as a fallback for
       browsers that ignore preconnect. -->
  <link rel="preconnect" href="https://zlpzajjfzezjildvchoz.supabase.co" crossorigin />
  <link rel="dns-prefetch" href="https://zlpzajjfzezjildvchoz.supabase.co" />

  <meta name="theme-color" content="#002F67" />
  <meta name="msapplication-TileColor" content="#002F67" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Trustpilot domain ownership verification. Ships on every page but
       Trustpilot only reads it from the homepage. Safe to leave in place
       after the check clears — it's inert everywhere else. -->
  <meta name="trustpilot-one-time-domain-verification-id" content="639742b0-52f4-448f-b67e-e9645894f0a9" />

  <!-- SEO tags (title, description, canonical, hreflang, og:*) are baked into
       each prerendered index.html by src/prerender.tsx and swapped at runtime
       by react-helmet-async on SPA navigation — no defaults belong here. -->

  <!-- Critical first-paint style. Styles the prerendered SEO skeleton
       (H1 + H2s that scripts/prerender-metas.mjs injects inside #root)
       so it paints as real, meaningful content on the very first HTML
       frame — the H1 becomes the LCP candidate and FCP fires without
       waiting for the eager JS to arrive.

       This replaces the earlier `visibility: hidden` fix: hiding those
       headings did stop the raw-serif flash but disqualified the H1
       for FCP/LCP, so both metrics had to wait for React to mount and
       re-render the real hero (~1.2 s cost on mobile). Now the skeleton
       IS the first paint; when React mounts, createRoot().render()
       wholesale-replaces #root's children (element replacement, not a
       layout shift — CLS stays 0), and the `#root > h1` / `#root > h2`
       selectors no longer match anything, so these rules have zero
       runtime cost after hydration.

       Colors match Luna's palette (luna-navy #002F67). Neutral centered
       layout works on every page (each prerendered subpage gets its own
       page_title H1, e.g. "Demander un devis" on /tarifs). The real
       homepage hero paints white-on-navy over a gradient right after
       React mounts — the swap reads as a stylistic upgrade, not a
       broken layout. -->
  <style>
    html, body { background: #fafafa; margin: 0; }
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    #root > h1 {
      margin: 0;
      padding: 5rem 1.5rem 1rem;
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 700;
      line-height: 1.15;
      color: #002F67;
      text-align: center;
    }
    #root > h2 {
      margin: 0;
      padding: 0.5rem 1.5rem;
      font-size: clamp(1.125rem, 2.5vw, 1.5rem);
      font-weight: 600;
      line-height: 1.3;
      color: #334155;
      text-align: center;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
