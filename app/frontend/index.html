<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />

  <!-- Favicons — generated from public/brand/logo-luna-250.png by
       scripts/generate-favicons.py. Two independent declaration groups:
       (1) Google/Bing crawlers want an unconditional, large (≥48px)
       square icon at a stable URL — they IGNORE (or misread) any <link>
       carrying a `media` attribute, so the 192x192 line and .ico stay
       naked. (2) Browsers get the dark-mode-aware 16/32 variants for
       the tab strip via `prefers-color-scheme`. Order matters: put the
       unconditional Google-friendly declarations first, so if a parser
       stops early it still picks a compliant icon. -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/android-chrome-512x512.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"      media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png"      media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32-dark.png" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16-dark.png" media="(prefers-color-scheme: dark)" />
  <link rel="manifest" href="/site.webmanifest" />

  <meta name="theme-color" content="#002F67" />
  <meta name="msapplication-TileColor" content="#002F67" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Trustpilot domain ownership verification. Ships on every page but
       Trustpilot only reads it from the homepage. Safe to leave in place
       after the check clears — it's inert everywhere else. -->
  <meta name="trustpilot-one-time-domain-verification-id" content="639742b0-52f4-448f-b67e-e9645894f0a9" />

  <!-- SEO tags (title, description, canonical, hreflang, og:*) are baked into
       each prerendered index.html by src/prerender.tsx and swapped at runtime
       by react-helmet-async on SPA navigation — no defaults belong here. -->

  <!-- Critical first-paint style. Two goals, one tiny inline block that
       never blocks another request:
         1. Paint the app's off-white ground immediately, so the ~100 ms
            between HTML arrival and React mount doesn't flash the raw
            white body background.
         2. Hide the SEO body skeleton (H1 + H2s injected by
            scripts/prerender-metas.mjs) from human eyes during that same
            gap — it stays in the DOM for crawlers (Bing, Google's first
            non-JS pass, social preview bots), but visibility:hidden keeps
            it off the paint. React clears #root on mount, so this rule
            has no runtime cost after hydration. -->
  <style>
    html, body { background: #fafafa; margin: 0; }
    #root > h1, #root > h2 { visibility: hidden; }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
